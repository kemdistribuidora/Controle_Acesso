<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Controle de Acesso - Câmara Fria</title>
<link rel="icon" href="imagens/icone.png">
<script src="vendor/face-api.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --navy: #16324f;
    --navy-dark: #0f2439;
    --accent: #d9481f;
    --accent-dark: #b83a16;
    --text: #1c2b3a;
    --muted: #6b7a89;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e7e9ec;
    --danger: #dc2626;
    --danger-bg: #fdecea;
    --ok: #16a34a;
    --ok-bg: #eafaf0;
    --info: #0891b2;
    --info-bg: #eaf6f9;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    background: radial-gradient(1200px 600px at 50% -10%, #fdf3ee 0%, var(--bg) 55%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  header { padding: 18px 4px 16px; display: flex; align-items: center; gap: 10px; }
  header img { height: 34px; }
  header .title h1 {
    font-size: 17px; margin: 0; font-weight: 700; color: var(--navy-dark); letter-spacing: -0.2px;
  }
  header .title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px;
    box-shadow: 0 1px 3px rgba(15, 36, 57, .06);
  }
  .tabs button {
    flex: 1; padding: 11px 8px; border: none; border-radius: 10px;
    background: transparent; color: var(--muted); font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s ease, color .15s ease;
  }
  .tabs button.active { background: var(--accent); color: #fff; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(15, 36, 57, .06);
  }

  section { display: none; }
  section.active { display: block; }

  .video-wrap {
    position: relative; border-radius: 12px; overflow: hidden;
    background: #000; margin-bottom: 12px; aspect-ratio: 4 / 3;
  }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .face-guide {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .face-guide::before {
    content: ''; width: 58%; height: 78%;
    border: 2px dashed rgba(255,255,255,0.45);
    border-radius: 50% / 42%;
  }

  input[type=text] {
    width: 100%; padding: 13px 14px; font-size: 16px; margin-bottom: 12px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    transition: border-color .15s ease;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  input[type=text]::placeholder { color: var(--muted); }

  button.action {
    width: 100%; padding: 15px; font-size: 15px; font-weight: 700;
    border: none; border-radius: 10px; background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s ease, transform .1s ease;
  }
  button.action:active { transform: scale(0.98); }
  button.action:not(:disabled):hover { background: var(--navy-dark); }
  button.action:disabled { background: #cbd3dc; color: #fff; }

  .status {
    margin-top: 12px; padding: 12px 14px; border-radius: 10px;
    text-align: center; font-size: 14px; min-height: 20px; display: none;
    animation: fadein .2s ease;
  }
  .status:not(:empty) { display: block; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.erro { background: var(--danger-bg); color: var(--danger); }
  .status.info { background: var(--info-bg); color: var(--info); }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  #loadingOverlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 100; transition: opacity .25s ease;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingText { font-size: 13px; color: var(--muted); text-align: center; padding: 0 24px; }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">Iniciando...</div>
</div>

<header>
  <img src="imagens/Distribuidora_KEM.png" alt="Distribuidora KEM">
  <div class="title">
    <h1>Controle de Acesso</h1>
    <p>Câmara Fria</p>
  </div>
</header>

<div class="tabs">
  <button id="tabPonto" class="active">⏱ Bater Ponto</button>
  <button id="tabCadastro">👤 Cadastrar</button>
</div>

<section id="secPonto" class="active">
  <div class="card">
    <div class="video-wrap">
      <video id="videoPonto" autoplay muted playsinline></video>
      <div class="face-guide"></div>
    </div>
    <button class="action" id="btnPonto">Reconhecer e Registrar</button>
    <div id="statusPonto" class="status"></div>
  </div>
</section>

<section id="secCadastro">
  <div class="card">
    <input type="text" id="inputNome" placeholder="Nome completo" autocomplete="off">
    <div class="video-wrap">
      <video id="videoCadastro" autoplay muted playsinline></video>
      <div class="face-guide"></div>
    </div>
    <button class="action" id="btnCadastro">Capturar Rosto e Cadastrar</button>
    <div id="statusCadastro" class="status"></div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
